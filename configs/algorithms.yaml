# Algorithm registry: the single source of truth for the status matrix in README.md
# (regenerate with `python scripts/docs/generate_status_matrix.py`).
#
# status: implemented | experimental | planned
# tests:  test files that validate the algorithm
# demo:   asset in docs/assets (optional)
# benchmark: Google Benchmark kernel or metric-benchmark section (optional)

algorithms:
  # --- Rigid-body geometry -------------------------------------------------------------------
  - {area: Geometry, name: "SO(3)/SE(3) exp, log, adjoint, Lie bracket", status: implemented, tests: [tests/unit/test_so3.cpp, tests/unit/test_se3.cpp, tests/numerical/test_lie_numerics.cpp], benchmark: BM_ExpSE3, reference: "Lynch & Park 2017"}
  - {area: Geometry, name: "Quaternion / axis-angle / Euler (ZYX, XYZ, ZYZ) conversions", status: implemented, tests: [tests/unit/test_rotation.cpp], benchmark: BM_QuaternionFromRotation, reference: "Shepperd 1978; Siciliano et al. 2009"}
  - {area: Geometry, name: "SLERP and geodesic / screw pose interpolation", status: implemented, tests: [tests/unit/test_interpolation.cpp], reference: "Shoemake 1985"}
  # --- Robot model ---------------------------------------------------------------------------
  - {area: Model, name: "Serial chain model (revolute/prismatic, inertia, armature, limits)", status: implemented, tests: [tests/unit/test_model.cpp], reference: "Featherstone 2008"}
  - {area: Model, name: "Standard and modified Denavit-Hartenberg", status: implemented, tests: [tests/unit/test_model.cpp], reference: "Spong et al. 2006; Craig 2005"}
  - {area: Model, name: "URDF import / export (serial chains)", status: implemented, tests: [tests/unit/test_model.cpp]}
