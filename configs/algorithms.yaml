  - {area: IK, name: "Analytical planar 2R / 3R (all branches)", status: implemented, tests: [tests/unit/test_inverse_kinematics.cpp], demo: fk_ik_2r.gif, reference: "Spong et al. 2006"}
  - {area: IK, name: "Jacobian transpose", status: implemented, tests: [tests/unit/test_inverse_kinematics.cpp], benchmark: "metric: inverse kinematics", reference: "Buss 2004"}
