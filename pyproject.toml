[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulatorcore-viz"
version = "0.1.0"
description = "Rendering of ManipulatorCore demo data (matplotlib, CPU only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["manipulatorcore_viz"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", ".venv", "ros2/**/build", "ros2/**/install"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["manipulatorcore_viz", "manipulatorcore", "_common", "render_rrt_arm"]
